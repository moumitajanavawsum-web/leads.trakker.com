<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8"/>
	<meta name="viewport" content="width=device-width, initial-scale=1"/>
	<title></title>
	<link rel="icon" type="image/png" href="https://s3.ap-south-1.amazonaws.com/res.cloudinary-s3.two.vawsum.com/2156100/1763108283_6916e5bb3a620.png.webp" />
	<link rel="shortcut icon" type="image/png" href="https://s3.ap-south-1.amazonaws.com/res.cloudinary-s3.two.vawsum.com/2156100/1763108283_6916e5bb3a620.png.webp" />
	<link rel="apple-touch-icon" href="https://s3.ap-south-1.amazonaws.com/res.cloudinary-s3.two.vawsum.com/2156100/1763108283_6916e5bb3a620.png.webp" />
	<link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css"/>
	<style>
		:root 
		{
			--appbar: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
			--ink: #0f172a;
			--muted: #64748b;
			--divider: #e2e8f0;
			--bg: #ffffff;
			--fab: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
			--gradient-start: #667eea;
			--gradient-end: #764ba2;
		}
	
		html,
		body 
		{
			height: 100%
		}
	
		body 
		{
			background: #f8fafc
		}
	
		.appbar 
		{
			position: sticky;
			top: 0;
			z-index: 10;
			background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
			color: #fff;
			height: 56px;
			display: flex;
			align-items: center;
			padding: 0 12px;
			box-shadow: 0 4px 12px rgba(102, 126, 234, 0.3);
		}
	
		.appbar .title 
		{
			font-weight: 700;
			letter-spacing: .5px;
			margin-left: 8px;
		}
	
		.appbar .actions 
		{
			margin-left: auto;
			display: flex;
			gap: 8px;
		}
	
		.appbar .icon-btn 
		{
			width: 36px;
			height: 36px;
			border-radius: 50%;
			display: grid;
			place-items: center;
			color: #fff;
			background: transparent;
			border: 0;
			outline: 0;
			transition: all 0.2s;
			cursor: pointer;
		}
	
		.appbar .icon-btn:hover 
		{
			background: rgba(255, 255, 255, 0.15);
			transform: scale(1.05);
		}
	
		.title-box 
		{
			cursor: pointer;
		}
	
		.content 
		
		{
			padding: 8px 0 88px;
		}
	
		.list 
		{
			background: var(--bg)
		}
	
		.list-item 
		{
			display: flex;
			align-items: flex-start;
			gap: 12px;
			padding: 12px 16px;
			border-bottom: 1px solid var(--divider);
			background: #fff;
			transition: all 0.2s;
			cursor: pointer;
			position: relative;
			overflow: hidden;
		}
	
		.list-item:hover 
		{
			background: #f8f9ff;
			transform: translateX(4px);
			box-shadow: -4px 0 0 0 linear-gradient(135deg, #667eea 0%, #764ba2 100%);
		}
	
		.avatar-wrap 
		{
			position: relative;
			width: 48px;
			height: 48px;
		}
	
		.avatar 
		{
			width: 48px;
			height: 48px;
			border-radius: 50%;
			border: 2px solid #e2e8f0;
			background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
			color: #fff;
			font-weight: 700;
			font-size: 14px;
			display: flex;
			align-items: center;
			justify-content: center;
			transition: all 0.2s;
		}
	
		.list-item:hover .avatar 
		{
			border-color: #667eea;
			transform: scale(1.05);
		}
	
		.status-dot 
		{
			position: absolute;
			right: -2px;
			top: -2px;
			width: 14px;
			height: 14px;
			border-radius: 50%;
			border: 2px solid #fff;
			background: #10b981;
			/* green */
			box-shadow: 0 2px 6px rgba(16, 185, 129, 0.4);
		}
	
		.status-hollow 
		{
			position: absolute;
			right: -2px;
			top: -2px;
			width: 14px;
			height: 14px;
			border-radius: 50%;
			border: 2px solid #cbd5e1;
			background: #fff;
		}
	
		.title-box 
		{
			flex: 1 1 auto;
		}
	
		.title-box .name 
		{
			font-weight: 700;
			color: var(--ink);
		}
	
		.title-box .sub 
		{
			font-size: .9rem;
			color: var(--muted);
			margin-top: 2px;
		}
	
		.counter 
		{
			margin-left: auto;
			color: #fff;
			font-weight: 600;
			min-width: 48px;
			text-align: center;
			padding: 6px 12px;
			border-radius: 20px;
			background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
			font-size: 0.85rem;
			box-shadow: 0 2px 8px rgba(102, 126, 234, 0.3);
		}
	
		.swipe-overlay 
		{
			position: absolute;
			inset: 0;
			pointer-events: none;
			opacity: 0;
			transition: opacity 0.15s linear;
			display: flex;
			align-items: center;
			justify-content: space-between;
			padding: 0 16px;
			font-weight: 700;
			border-radius: 8px;
		}
	
		.swipe-start 
		{
			background: rgba(56, 142, 60, 0.85);
			color: #fff;
		}
	
		.swipe-end 
		{
			background: rgba(211, 47, 47, 0.85);
			color: #fff;
		}
	
		.fab 
		{
			position: fixed;
			right: 20px;
			bottom: 76px;
			width: 56px;
			height: 56px;
			border-radius: 50%;
			display: flex;
			align-items: center;
			justify-content: center;
			background: linear-gradient(135deg, #667eea 0%, #764ba2 100%) !important;
			color: #fff !important;
			border: 0 !important;
			box-shadow: 0 10px 24px rgba(102, 126, 234, 0.4);
			font-size: 28px;
			line-height: 0;
			cursor: pointer;
			transition: all 0.2s;
			z-index: 1000;
		}
	
		.fab:hover 
		{
			transform: translateY(-3px) scale(1.05) !important;
			box-shadow: 0 12px 28px rgba(102, 126, 234, 0.5);
		}
	
		.fab:active 
		{
			transform: translateY(-1px) scale(1) !important;
		}
	
		.bottom-nav 
		{
			position: fixed;
			left: 0;
			right: 0;
			bottom: 0;
			background: #fff;
			border-top: 1px solid var(--divider);
			height: 56px;
			display: flex;
			align-items: center;
			justify-content: center;
			color: #1e293b;
			font-weight: 600;
		}
	
		.searchbar 
		{
			display: none;
			background: #fff;
			padding: 8px 12px;
			border-bottom: 1px solid var(--divider);
			animation: slideDown 0.3s ease-out;
		}
	
		@keyframes slideDown 
		{
			from {
				opacity: 0;
				transform: translateY(-10px);
			}
	
			to {
				opacity: 1;
				transform: translateY(0);
			}
		}
	
		.searchbar input 
		{
			width: 100%;
			border: 2px solid #e2e8f0;
			border-radius: 8px;
			padding: 8px 12px;
			transition: all 0.2s;
		}
	
		.searchbar input:focus 
		{
			border-color: #667eea;
			outline: none;
			box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
		}
	
		@media (min-width:768px) 
		{
			.container-narrow {
				max-width: 560px;
				margin: 0 auto;
				background: #fff;
				border: 1px solid var(--divider);
				border-top: 0;
			}
	}

	/* Mobile Responsive Styles */
	@media (max-width: 767px) 
	{
		.appbar .title {
			font-size: 0.9rem;
		}

		.appbar .icon-btn {
			width: 32px;
			height: 32px;
		}

		.appbar .icon-btn svg {
			width: 18px;
			height: 18px;
		}

		.list-item {
			padding: 10px 12px;
			gap: 10px;
		}

		.avatar {
			width: 40px;
			height: 40px;
			font-size: 12px;
		}

		.title-box .name {
			font-size: 0.9rem;
		}

		.title-box .sub {
			font-size: 0.8rem;
		}

		.counter {
			min-width: 40px;
			padding: 4px 10px;
			font-size: 0.8rem;
		}

		.fab {
			width: 48px;
			height: 48px;
			font-size: 24px;
			right: 16px;
			bottom: 80px;
		}

		.bottom-nav {
			height: 52px;
			font-size: 0.9rem;
		}

		.searchbar {
			padding: 6px 10px;
		}

		.searchbar input {
			padding: 6px 10px;
			font-size: 0.9rem;
		}
	}

	@media (max-width: 576px) 
	{
		.appbar {
			padding: 0 8px;
		}

		.appbar .title {
			font-size: 0.85rem;
		}

		.list-item {
			padding: 8px 10px;
		}

		.avatar {
			width: 36px;
			height: 36px;
			font-size: 11px;
		}

		.title-box .name {
			font-size: 0.85rem;
		}

		.title-box .sub {
			font-size: 0.75rem;
		}

		.counter {
			min-width: 36px;
			padding: 3px 8px;
			font-size: 0.75rem;
		}

		.fab {
			width: 44px;
			height: 44px;
			font-size: 22px;
		}
	}

	/* Navigation Drawer */
	.nav-drawer 
	{
		position: fixed;
		left: 0;
		top: 0;
		bottom: 0;
		width: 280px;
		background: #fff;
		box-shadow: 4px 0 12px rgba(0, 0, 0, 0.15);
		transform: translateX(-100%);
		transition: transform 0.3s ease-out;
		z-index: 1000;
	}

	.nav-drawer.open 
	{
		transform: translateX(0);
	}

	.drawer-overlay 
	{
		position: fixed;
		inset: 0;
		background: rgba(0, 0, 0, 0.4);
		opacity: 0;
		pointer-events: none;
		transition: opacity 0.3s ease-out;
		z-index: 999;
	}

	.drawer-overlay.active 
	{
		opacity: 1;
		pointer-events: auto;
	}

	.drawer-header 
	{
		padding: 20px 16px;
		background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
		color: #fff;
		border-bottom: 1px solid rgba(255, 255, 255, 0.1);
	}

	.drawer-header .drawer-close 
	{
		position: absolute;
		top: 12px;
		right: 12px;
		background: rgba(255, 255, 255, 0.2);
		border: none;
		color: #fff;
		width: 32px;
		height: 32px;
		border-radius: 50%;
		display: flex;
		align-items: center;
		justify-content: center;
		cursor: pointer;
		transition: all 0.2s;
	}

	.drawer-header .drawer-close:hover 
	{
		background: rgba(255, 255, 255, 0.3);
	}

	.drawer-header h4 
	{
		margin: 0;
		font-size: 1.2rem;
		font-weight: 600;
	}

	.drawer-body 
	{
		padding: 16px 0;
	}

	.drawer-menu-item 
	{
		display: flex;
		align-items: center;
		padding: 14px 20px;
		color: var(--ink);
		text-decoration: none;
		transition: all 0.2s;
		border-left: 3px solid transparent;
	}

	.drawer-menu-item:hover 
	{
		background: #f8f9ff;
		border-left-color: #667eea;
		color: #667eea;
	}

	.drawer-menu-item svg 
	{
		margin-right: 12px;
		width: 20px;
		height: 20px;
	}

	@media (max-width: 576px) 
	{
		.nav-drawer {
			width: 260px;
		}
	}
</style>
</head>

	<div class="searchbar" id="searchBar">
		<input id="searchInput" class="form-control" placeholder="Search groups..."/>
	</div>

	<main class="content">
		<div class="container-narrow">
			<div id="listRoot" class="list"></div>
		</div>
	</main>

	<button class="fab" id="fab">+</button>
	<nav class="bottom-nav">Home</nav>

	<script src="https://code.jquery.com/jquery-3.1.1.min.js"></script>
	<script>
		'use strict';

		function createJSON(params, values) 
		{
			const pairs = [];
			for (let i = 0; i < params.length; i++) 
			{
				pairs.push(encodeURIComponent(params[i]) + "=" + encodeURIComponent(values[i] == null ? "" : values[i]));
			}
			return pairs.join("&");
		}

		function promisingAjaxCall(url, method, dataString, contentType) 
		{
			return new Promise(function(resolve, reject) 
			{
				const xhr = new XMLHttpRequest();
				xhr.open(method, url, true);
				xhr.setRequestHeader("Content-Type", contentType || "application/x-www-form-urlencoded");
				
				xhr.onreadystatechange = function() 
				{
					if (xhr.readyState === 4) 
					{
						if (xhr.status >= 200 && xhr.status < 300) 
						{
							try 
							{
								const json = JSON.parse(xhr.responseText);
								resolve(json);
							} 
							catch (e) 
							{
								resolve(
									{ 
										isOk: false, message: "Invalid JSON" 
									});
							}
						} 
						else 
						{
							reject(new Error("HTTP " + xhr.status));
						}
					}
				};
				
				xhr.onerror = function() 
				{
					reject(new Error("Network error"));
				};
				
				xhr.send(dataString);
			});
		}

		// Clear the verified visitor's name when logging out
		function handleLogout()
		{
			localStorage.removeItem('VISITOR_FIRST_NAME');
			localStorage.removeItem('VISITOR_MIDDLE_NAME');
			localStorage.removeItem('VISITOR_LAST_NAME');
			localStorage.removeItem('USER_VISITOR_NAME');
		}

		let state =
		{
			groupList: [],
			filteredGroupList: [],
			isNotSearched: true,
			isSwiped: false
		};

		// Fetch groups from localStorage or API
		function loadGroupsFromStorage() 
		{
			const saved = localStorage.getItem('savedGroupList');
			if (saved) 
			{
				try 
				{
					return JSON.parse(saved);
				} 
				catch (e) 
				{
					return [];
				}
			}
			return [];
		}

		function fetchGroupsFromApi() 
		{
			const personId = localStorage.getItem('USER_PERSON_ID') || '1';
			const url = 'https://trakkerz.trakkerz.com/api/PersonsToGroups/GetAllGroupDetailsByPersonId';
			
			const params = ["PersonId"];
			const values = [personId];
			const dataString = createJSON(params, values);
			
			promisingAjaxCall(url, "POST", dataString, "application/x-www-form-urlencoded")
			.then(function (res) 
			{
				if (res && res.IsOk && res.ResponseObject && Array.isArray(res.ResponseObject)) 
				{
					const mappedGroups = res.ResponseObject.map(g => (
					{
						groupId: g.GroupId || '',
						name: g.GroupName || 'Unnamed Group',
						sub: `${g.PersonType || 'Member'}, ${g.OrganizationName || ''}`,
						done: g.ActiveMembersCount || 0,
						total: g.TotalMembersCount || 0,
						status: g.ActiveMembersCount > 0 ? 'active' : 'idle',
						personType: g.PersonType || '',
						tripId: g.TripId || '0',
						groupName: g.GroupName || '',
						institutionId: g.InstitutionId || '',
						routeId: g.RouteId || '',
						tripStatus: g.TripStatus || 'idle'
					}));
					
					state.groupList = mappedGroups;
					localStorage.setItem('savedGroupList', JSON.stringify(state.groupList));
					render(state.groupList);
				}
			})
			.catch(function (err) 
			{
				const stored = loadGroupsFromStorage();
				if (stored.length > 0) 
				{
					state.groupList = stored;
					render(state.groupList);
				}
			});
		}

		function fetchLeadCountForGroup(group, counterEl)
		{
			const groupId = parseInt(group.groupId, 10) || 0;
			const personType = 'Driver'; 

			const today = new Date();
			const tomorrow = new Date(today);
			tomorrow.setDate(today.getDate() + 1);
			const toDate = tomorrow.toISOString().split('T')[0];
			const fromDate = '2017-10-01';

			// Step 1: resolve the PersonId of the group's "Driver"
			const ptUrl = 'https://trakkerz.trakkerz.com/api/Reports/getPersonTypeDetails';
			const ptBody = { GroupId: groupId, PersonType: personType };

			promisingAjaxCall(ptUrl, 'POST', JSON.stringify(ptBody), 'application/json')
			.then(function (ptRes)
			{
				let personId = parseInt(localStorage.getItem('USER_PERSON_ID'), 10) || 0;
				if (ptRes && (ptRes.IsOk === true || ptRes.isOk === true)
					&& Array.isArray(ptRes.ResponseObject) && ptRes.ResponseObject.length > 0)
				{
					const drivers = ptRes.ResponseObject.filter(function (p) { return p.PersonType === personType; });
					const chosen = drivers.length > 0 ? drivers[0] : ptRes.ResponseObject[0];
					personId = chosen.PersonId || personId;
				}

				const leadsUrl = 'https://management.trakkerz.com/api/Reports/NewLeads';
				const leadsBody =
				{
					PersonId: personId,
					GroupId: groupId,
					FromDate: fromDate,
					ToDate: toDate
				};
				return promisingAjaxCall(leadsUrl, 'POST', JSON.stringify(leadsBody), 'application/json');
			})
			.then(function (res)
			{
				if (res && res.IsOk && Array.isArray(res.ResponseObject))
				{
					counterEl.textContent = res.ResponseObject.length;
				}
				else
				{
					counterEl.textContent = '0';
				}
			})
			.catch(function ()
			{
				counterEl.textContent = '0';
			});
		}

		const root = document.getElementById('listRoot');
		const searchBtn = document.getElementById('searchBtn');
		const searchBar = document.getElementById('searchBar');
		const searchInput = document.getElementById('searchInput');

		function render(list) 
		{
			root.innerHTML = '';
			if (!list || list.length === 0) 
			{
				return;
			}
			
			list.forEach((g, idx) => 
			{
				const item = document.createElement('div');
				item.className = 'list-item';

				// Swipe overlays
				const swipeStart = document.createElement('div');
				swipeStart.className = 'swipe-overlay swipe-start';
				swipeStart.innerHTML = '<span>Start Trip</span><span>›</span>';
				
				const swipeEnd = document.createElement('div');
				swipeEnd.className = 'swipe-overlay swipe-end';
				swipeEnd.innerHTML = '<span>‹</span><span>End Trip</span>';

				const avWrap = document.createElement('div');
				avWrap.className = 'avatar-wrap';
				const avatar = document.createElement('div');
				avatar.className = 'avatar';
				const groupName = g.name || 'Unnamed Group';
				const words = groupName.split(' ');
				const initials = words.slice(0, 2).map(w => w.charAt(0).toUpperCase()).join('');
				avatar.textContent = initials || '?';
				avWrap.appendChild(avatar);
				const dot = document.createElement('span');
				dot.className = (g.done > 0 ? 'status-dot' : 'status-hollow');
				avWrap.appendChild(dot);

				const title = document.createElement('div');
				title.className = 'title-box';
				const name = document.createElement('div');
				name.className = 'name';
				name.textContent = groupName;
				const sub = document.createElement('div');
				sub.className = 'sub';
				sub.textContent = g.sub || '';
				title.appendChild(name);
				title.appendChild(sub);

				const counter = document.createElement('div');
				counter.className = 'counter';
				counter.textContent = '…';                
				fetchLeadCountForGroup(g, counter);        

				item.appendChild(swipeStart);
				item.appendChild(swipeEnd);
				item.appendChild(avWrap);
				item.appendChild(title);
				item.appendChild(counter);
				
				// Click to navigate
				item.onclick = function() 
				{ 
					if (!state.isSwiped) 
					{
						localStorage.setItem('USER_GROUP_ID', g.groupId || '');
						localStorage.setItem('USER_GROUP_NAME', groupName);
						localStorage.setItem('USER_INSTITUTION_ID', g.institutionId || '');
						localStorage.setItem('USER_ROUTE_ID', g.routeId || '');
						localStorage.setItem('USER_PERSON_TYPE', g.personType || '');
						
						window.location.href = 'leads.html?group=' + encodeURIComponent(groupName); 
					}
				};
				
				attachSwipeHandlers(item, g, idx);
				
				root.appendChild(item);
			});
		}

		function attachSwipeHandlers(item, g, index) 
		{
			let startX = 0;
			let currentX = 0;
			let isPointer = false;
			let threshold = 80;
			let swipeStart = item.querySelector('.swipe-start');
			let swipeEnd = item.querySelector('.swipe-end');

			function handlerStart(e) 
			{
				isPointer = true;
				startX = getX(e);
				currentX = startX;
			}

			function handlerMove(e) 
			{
				if (!isPointer) return;
				currentX = getX(e);
				let dx = currentX - startX;
				if (dx > 10) 
				{
					swipeStart.style.opacity = Math.min(1, dx / 120);
					swipeEnd.style.opacity = 0;
				} 
				else if (dx < -10) 
				{
					swipeEnd.style.opacity = Math.min(1, Math.abs(dx) / 120);
					swipeStart.style.opacity = 0;
				}
			}

			function handlerEnd() 
			{
				if (!isPointer) return;
				isPointer = false;
				let dx = currentX - startX;
				swipeStart.style.opacity = 0;
				swipeEnd.style.opacity = 0;
				if (dx >= threshold) 
				{
					onSwipe(index, 'right');
				} 
				else if (dx <= -threshold) 
				{
					onSwipe(index, 'left');
				}
			}

			item.onpointerdown = handlerStart;
			item.ontouchstart = handlerStart;
			item.onmousedown = handlerStart;

			item.onpointermove = handlerMove;
			item.ontouchmove = handlerMove;
			item.onmousemove = handlerMove;

			item.onpointerup = handlerEnd;
			item.ontouchend = handlerEnd;
			item.onmouseup = handlerEnd;
			item.onmouseleave = handlerEnd;
		}

		function getX(e) 
		{
			if (e.touches && e.touches.length) 
			{
				return e.touches[0].clientX;
			}
			return e.clientX || 0;
		}

		function onSwipe(position, direction) 
		{
			state.isSwiped = true;
			let list = state.isNotSearched ? state.groupList : state.filteredGroupList;
			let info = list[position] || {};
			toast(direction === 'right' ? 'Swiped right: Start trip' : 'Swiped left: End trip');
			setTimeout(() => 
			{ 
				state.isSwiped = false; 
			}, 500);
		}

		function filterList(q) 
		{
			q = (q || '').toLowerCase().trim();
			if (!q) 
			{
				state.isNotSearched = true;
				return render(state.groupList);
			}
			const filtered = state.groupList.filter(g => 
				g.name.toLowerCase().includes(q) || g.sub.toLowerCase().includes(q)
			);
			state.filteredGroupList = filtered;
			state.isNotSearched = false;
			render(filtered);
		}

		function toast(msg) 
		{
			const toast = document.createElement('div');
			toast.style.cssText = 'position:fixed;left:50%;transform:translateX(-50%);bottom:24px;z-index:2000;background:#1a2b5b;color:#fff;padding:10px 16px;border-radius:10px;box-shadow:0 8px 24px rgba(0,0,0,.35)';
			toast.textContent = msg;
			document.body.appendChild(toast);
			setTimeout(() => 
			{
				toast.style.transition = 'opacity 0.2s';
				toast.style.opacity = '0';
				setTimeout(() => toast.remove(), 200);
			}, 1600);
		}

		// Toggle search
		searchBtn.onclick = function() 
		{
			const visible = searchBar.style.display === 'block';
			searchBar.style.display = visible ? 'none' : 'block';
			if (!visible) 
			{
				searchInput.focus();
			} 
			else
			{
				searchInput.value = '';
				state.isNotSearched = true;
				render(state.groupList);
			}
		};
		searchInput.oninput = function(e) 
		{ 
			filterList(e.target.value); 
		};

		// FAB action
		document.getElementById('fab').onclick = function() 
		{ 
			window.location.href = 'add_lead_html_js_bootstrap.html'; 
		};

		// Navigation Drawer functionality
		const navDrawer = document.getElementById('navDrawer');
		const drawerOverlay = document.getElementById('drawerOverlay');
		const drawerClose = document.getElementById('drawerClose');
		const navBtn = document.getElementById('navBtn');

		function openDrawer() 
		{
			navDrawer.classList.add('open');
			drawerOverlay.classList.add('active');
			document.body.style.overflow = 'hidden';
		}

		function closeDrawer() 
		{
			navDrawer.classList.remove('open');
			drawerOverlay.classList.remove('active');
			document.body.style.overflow = '';
		}

		// Open drawer when hamburger icon is clicked
		navBtn.onclick = function() 
		{
			openDrawer();
		};

		// Close drawer when X button is clicked
		drawerClose.onclick = function() 
		{
			closeDrawer();
		};

		// Close drawer when overlay is clicked
		drawerOverlay.onclick = function() 
		{
			closeDrawer();
		};

		// Handle activity report menu item
		document.getElementById('menuActivityReport').onclick = function(e) 
		{
			e.preventDefault();
			closeDrawer();
			window.location.href = 'activity_report.html';
		};

		// Boot - load groups from storage first, then fetch from API
		window.addEventListener('DOMContentLoaded', function() 
		{
			const stored = loadGroupsFromStorage();
			if (stored.length > 0) {
				state.groupList = stored;
				render(state.groupList);
			}
			// Fetch fresh data from API
			fetchGroupsFromApi();
		});
	</script>
</body>
</html>
