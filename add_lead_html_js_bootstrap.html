<!doctype html>
<html lang="en">

<head>
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1" />
	<title>Add Lead</title>
	<link rel="icon" type="image/png" href="https://s3.ap-south-1.amazonaws.com/res.cloudinary-s3.two.vawsum.com/2156100/1763108283_6916e5bb3a620.png.webp" />
	<link rel="shortcut icon" type="image/png" href="https://s3.ap-south-1.amazonaws.com/res.cloudinary-s3.two.vawsum.com/2156100/1763108283_6916e5bb3a620.png.webp" />
	<link rel="apple-touch-icon" href="https://s3.ap-south-1.amazonaws.com/res.cloudinary-s3.two.vawsum.com/2156100/1763108283_6916e5bb3a620.png.webp" />
	<link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" />
	<style>
		body 
		{
			background: #f7f9fc;
		}
	
		.card 
		{
			border-radius: 16px;
			box-shadow: 0 10px 24px rgba(0, 0, 0, .06);
		}
	
		.section-title 
		{
			font-weight: 600;
			color: #2b6cb0;
		}
	
		.badge-pill 
		{
			cursor: pointer;
		}
	
		#moreSection 
		{
			display: none;
		}
	
		.fab 
		{
			position: fixed;
			right: 20px;
			bottom: 20px;
			width: 56px;
			height: 56px;
			border-radius: 50%;
			display: flex;
			align-items: center;
			justify-content: center;
			background: #2b6cb0;
			color: #fff;
			box-shadow: 0 6px 18px rgba(0, 0, 0, .18);
		}
	
		.fab:disabled 
		{
			opacity: .6;
		}
	
		.list-chip 
		{
			display: flex;
			gap: .2rem;
			flex-wrap: wrap;
		}
	
		.chip 
		{
			padding: .4rem .75rem;
			border-radius: 20px;
			border: 1px solid #dee2e6;
		}
	
		.chip.active 
		{
			background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
			color: #fff;
			border-color: transparent;
		}
	
		.form-control:disabled 
		{
			background: #eef2f7;
		}
	
		.fab 
		{
			position: fixed;
			right: 20px;
			bottom: 20px;
			width: 56px;
			height: 56px;
			border-radius: 50%;
			display: flex;
			align-items: center;
			justify-content: center;
			background: linear-gradient(135deg, #667eea 0%, #764ba2 100%) !important;
			color: white !important;
			font-size: 1.5rem;
			font-weight: bold;
			border: none !important;
			box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
			cursor: pointer;
			transition: all 0.2s;
		}
	
		.fab:hover 
		{
			transform: translateY(-3px) !important;
			box-shadow: 0 6px 16px rgba(102, 126, 234, 0.5);
		}
	
		.fab:active 
		{
			transform: translateY(-1px) !important;
		}
	
		.btn-primary 
		{
			background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
			border: none;
			color: white;
			font-weight: 600;
			transition: all 0.2s;
		}
	
		.btn-primary:hover 
		{
			transform: translateY(-2px) !important;
			box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
			background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
			color: white;
		}
	
		.btn-primary:active 
		{
			transform: translateY(0) !important;
		}
	
		.btn-primary:disabled 
		{
			opacity: 0.6;
			cursor: not-allowed;
		}
	
		.back-button 
		{
			display: inline-flex;
			align-items: center;
			gap: 8px;
			padding: 6px 12px;
			background: white;
			border: none;
			border-radius: 8px;
			cursor: pointer;
			text-decoration: none;
			color: #0066ff;
			font-weight: 600;
			font-size: 15px;
			transition: all 0.2s;
			margin-bottom: 16px;
		}
	
		.back-button:hover 
		{
			background: #f0f5ff;
			text-decoration: none;
			color: #0066ff;
			transform: translateX(-2px);
		}
	
		.back-icon 
		{
			width: 24px;
			height: 24px;
			border-radius: 50%;
			background: #d1d5db;
			display: flex;
			align-items: center;
			justify-content: center;
			font-size: 12px;
			color: white;
		}
	
			.back-button:hover .back-icon 
			{
				background: #9ca3af;
			}

		@media (max-width: 767px) {
			.container {
				padding: 1rem;
			}

			.card {
				padding: 1rem !important;
			}

			.section-title {
				font-size: 1.2rem;
			}

			.back-button {
				padding: 4px 8px;
				font-size: 13px;
				margin-bottom: 12px;
			}

			.back-icon {
				width: 20px;
				height: 20px;
				font-size: 11px;
			}

			.fab {
				width: 48px;
				height: 48px;
				font-size: 20px;
			}

			.input-group-append .btn {
				padding: 6px 12px;
			}

			.chip {
				padding: 0.3rem 0.5rem;
				font-size: 0.8rem;
			}
		}

		@media (max-width: 576px) {
			.section-title {
				font-size: 1.1rem;
			}

			.card {
				padding: 0.75rem !important;
			}

			.back-button {
				padding: 3px 6px;
				font-size: 12px;
			}

			.fab {
				width: 44px;
				height: 44px;
				font-size: 18px;
			}
		}
</style>
</head>

<body>

				<div class="card p-4 p-md-5">

					<div class="row">
						<div class="col-12 col-md-6">
							<div class="form-group">

						<div class="col-12 col-md-8">

									<div class="input-group-append">
										<button id="btnPickContact" class="btn btn-outline-secondary" type="button">Contacts</button>
									</div>
								</div>

						</div>
						<div class="col-12 col-md-4">

						<small class="text-muted d-block mb-2">Contact can be an email id or a mobile number.</small>
						<div class="row">

							</div>
							<div class="col-12 col-md-6">
								<div class="form-group">
									<label>Buyer 1 Contact</label>
									<input id="etBuyer1Contact" class="form-control" placeholder="Email or mobile" />

							</div>
							<div class="col-12 col-md-6">

								</div>
							</div>
							<div class="col-12 col-md-6">
								<div class="form-group">
									<label>Buyer 2 Contact</label>
									<input id="etBuyer2Contact" class="form-control" placeholder="Email or mobile" />
								</div>
							</div>
							<div class="col-12 col-md-6">
								<div class="form-group">
									<label>Buyer 3 Name</label>
									<input id="etBuyer3Name" class="form-control" placeholder="Buyer 3 name" />
								</div>
							</div>
							<div class="col-12 col-md-6">
								<div class="form-group">
									<label>Buyer 3 Contact</label>

							<div class="col-12 col-md-6">

			</div>

	<div class="modal fade" id="mapPickerModal" tabindex="-1" role="dialog" aria-hidden="true">
		<div class="modal-dialog modal-dialog-centered modal-xl" role="document" style="max-width:96vw;">
			<div class="modal-content" style="height:86vh;">
				<div class="modal-header">
					<h5 class="modal-title">Lead Location</h5>
					<button type="button" class="close" data-dismiss="modal" aria-label="Close"><span>&times;</span></button>
				</div>
				<div class="modal-body p-0" style="height:calc(86vh - 120px);">

	<script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
	<script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.1/dist/umd/popper.min.js"></script>
	<script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
	<script
		src="https://maps.googleapis.com/maps/api/js?key=AIzaSyCNUwh7B54O-W_POxPe9Uqer_UOo279Wj8&libraries=places"></script>

	<script>
		"use strict";
		const BASE_URL = "https://management.trakkerz.com/api/";
		// const BASE_URL = "http://localhost:51450/api/";

		// Buyers + coach. Requires the new BO_ADD_LEAD columns (run AddBuyerColumns.sql) on the
		// backend DB. Enabled end-to-end. Set to false only if you need to test without those columns.
		const BUYERS_COACH_ENABLED = true;
		const ENDPOINTS =
		{
			performAdd: "Actions/PerformAction",
			editLeadDetails: "Actions/EditLeadDetails",
			fetchLeadById: "Actions/FetchLeadDetailsById",
			getMembersByGroup: "Members/GetByGroupId",
			uploadImage: "Files/UploadImage"
		};

		// When a leadId is present in the URL (e.g. add_lead_html_js_bootstrap.html?leadId=123)
		// the page works in EDIT mode: it pre-fills the lead and saves via EditLeadDetails.
		function getQueryParam(name)
		{
			let m = new RegExp("[?&]" + name + "=([^&]*)").exec(window.location.search);
			return m ? decodeURIComponent(m[1].replace(/\+/g, " ")) : "";
		}
		let editLeadId = parseInt(getQueryParam("leadId"), 10) || 0;

		// Carry the group context back to the leads list so its header stays consistent.
		function leadsListUrl()
		{
			let g = getQueryParam("group");
			return g ? ("leads.html?group=" + encodeURIComponent(g)) : "leads.html";
		}
		let schoolTypes = ["Pre School", "School", "High School", "College", "Activity Center"];
		let unitTypes = ["Under 100", "100-500", "500-1000", "Above 1000"];
		let paymentMethods = ["Annual Upfront", "Semi Annual-Advance", "Quarterly Advance", "Monthly Advance"];
		let sources = ["Referral", "Inbound", "Outbound", "Event", "Other"];
		let freeMonthsOptions = ["0", "1", "2", "3", "4", "5", "6", "9", "12"];
		let selectedUnitType = "";
		let selectedPaymentType = paymentMethods[0];
		let selectedStage = "";
		let selectedAssignee = { index: -1, name: "", personId: "" };
		let groupId = localStorage.getItem('USER_GROUP_ID') || "1";
		let organizationId = 1;
		let personId = localStorage.getItem('USER_PERSON_ID') || "1";
		let creatorName = (localStorage.getItem('USER_FIRST_NAME') || '') + ' ' + (localStorage.getItem('USER_LAST_NAME') || '');
		let addressString = "";
		let localNameHint = "";
		let city = "";
		let state = "";
		let country = "";
		let latitude = 0.0;
		let longitude = 0.0;
		let imageId = "";
		let quotationDateForApi = "";
		let conversionDateForApi = "";
		let isSubmitting = false;

		function setMsg(text, type) 
		{
			let m = document.getElementById("msg");
			if (!text) 
			{
				m.className = "";
				m.textContent = "";
				return;
			}
			m.className = "alert alert-" + (type || "info");
			m.textContent = text;
		}

		function createJSON(params, values) 
		{
			let pairs = [];
			for (let i = 0; i < params.length; i++) 
			{
				pairs.push(encodeURIComponent(params[i]) + "=" + encodeURIComponent(values[i] == null ? "" : values[i]));
			}
			return pairs.join("&");
		}

		function promisingAjaxCall(url, method, dataString, contentType) 
		{
			return fetch(url,
			{
				method: method,
				headers:
				{
					"Content-Type": contentType || "application/x-www-form-urlencoded"
				},
				body: dataString
			})
			.then(function (r) 
			{
				if (!r.ok) 
				{
					throw new Error("HTTP " + r.status);
				}
				return r.text();
			})
			.then(function (txt) 
			{
				try 
				{
					return JSON.parse(txt);
				}
				catch (e) 
				{
					return { isOk: false, message: "Invalid JSON" };
				}
			});
		}

		function fillSelect(id, arr) 
		{
			let el = document.getElementById(id);
			el.innerHTML = "";
			for (let i = 0; i < arr.length; i++) 
			{
				let opt = document.createElement("option");
				opt.value = arr[i];
				opt.textContent = arr[i];
				el.appendChild(opt);
			}
		}

		function buildChips() 
		{
			let wrap = document.getElementById("unitTypeChips");
			wrap.innerHTML = "";

			for (let i = 0; i < unitTypes.length; i++) 
			{
				let span = document.createElement("span");
				span.className = "chip";
				span.textContent = unitTypes[i];
				span.dataset.val = unitTypes[i];
				span.addEventListener("click", function () 
				{

		function initMapIfNeeded() 
		{
			if (map) 
			{
				google.maps.event.trigger(map, "resize");
				return;
			}

			geocoder = new google.maps.Geocoder();

			let startLat = latitude || 22.5726;
			let startLng = longitude || 88.3639;

			map = new google.maps.Map(document.getElementById("mapCanvas"),
			{
				center: 
				{ 
					lat: startLat, lng: startLng 
				},
				zoom: 15,
				mapTypeControl: false,
				streetViewControl: false,
				fullscreenControl: false
			});

			marker = new google.maps.Marker(
			{
				position: { lat: startLat, lng: startLng },
				map: map,
				draggable: true
			});

			google.maps.event.addListener(marker, "dragend", function () 
			{
				let p = marker.getPosition();
				updateTempPick(p.lat(), p.lng());
			});

			map.addListener("click", function (e) 
			{
				marker.setPosition(e.latLng);
				updateTempPick(e.latLng.lat(), e.latLng.lng());
			});

			let input = document.getElementById("mapSearchBox");
			placeSearch = new google.maps.places.SearchBox(input);
			map.addListener("bounds_changed", function () 
			{
				placeSearch.setBounds(map.getBounds());
			});

			placeSearch.addListener("places_changed", function () 
			{
				let places = placeSearch.getPlaces();
				if (!places || places.length === 0) return;
				let p = places[0];
				if (!p.geometry || !p.geometry.location) return;
				map.panTo(p.geometry.location);
				map.setZoom(17);
				marker.setPosition(p.geometry.location);
				updateTempPick(p.geometry.location.lat(), p.geometry.location.lng(), p.formatted_address);
			});

			updateTempPick(startLat, startLng);
		}

		function updateTempPick(lat, lng, presetAddress) 
		{
			tempPick.lat = lat;
			tempPick.lng = lng;

			if (presetAddress && presetAddress.length > 0) 
			{
				tempPick.address = presetAddress;
				renderPickedLabels();
				return;
			}

			geocoder.geocode({ location: { lat: lat, lng: lng } }, function (results, status) 
			{
				if (status === "OK" && results && results.length > 0) 
				{
					tempPick.address = results[0].formatted_address || "";
				}
				else 
				{
					tempPick.address = "";
				}
				renderPickedLabels();
			});
		}

		function setSelectValue(id, val)
		{
			let el = document.getElementById(id);
			if (!el || val == null || val === "") return;
			let found = false;
			for (let i = 0; i < el.options.length; i++) { if (el.options[i].value === val) { found = true; break; } }
			if (!found) { let opt = document.createElement("option"); opt.value = val; opt.textContent = val; el.appendChild(opt); }

		// Pre-fill the form from an existing lead (edit mode).
		const loadLeadForEdit = () =>
		{
			let url = BASE_URL + ENDPOINTS.fetchLeadById;
			let dataString = createJSON(["LeadId"], [editLeadId]);
			setMsg("Loading lead...");

			promisingAjaxCall(url, "POST", dataString, "application/x-www-form-urlencoded").then((res) =>
			{
				let ok = res && (res.isOk === true || res.IsOk === true);
				let o = res ? (res.responseObject || res.ResponseObject) : null;
				if (!ok || !o)
				{
					setMsg((res && (res.message || res.Message)) || "Could not load lead details", "danger");
					return;
				}
				setMsg("");

				// API may return 'N/A' (ISNULL placeholder) for empty buyer/coach fields - show those as blank.
				let g = (a, b) =>
				{
					let v = (o[a] != null ? o[a] : (o[b] != null ? o[b] : ""));
					return (v === "N/A") ? "" : v;
				};

				document.getElementById("etNameOfOrganization").value = g("LeadName", "leadName");
				document.getElementById("etPhone").value = g("ContactNumber", "contactNumber");
				document.getElementById("etContactPersonName").value = g("SchoolContactPerson", "schoolContactPerson");
				document.getElementById("etNote").value = g("Remarks", "remarks");
				document.getElementById("etContactPersonDesignation").value = g("Designation", "designation");
				document.getElementById("etContactPersonEmail").value = g("EmailId", "emailId");
				document.getElementById("etSourceDetails").value = g("SourceDetails", "sourceDetails");
				// Prefer the full ADDRESS column; fall back to the "city, country" field. Ignore a lone comma.
				let loc = g("LocationAddress", "locationAddress") || g("Address", "address");
				if (loc.replace(/[,\s]/g, "") === "") { loc = ""; }
				document.getElementById("etLocation").value = loc;
				addressString = loc;

				setSelectValue("spSchoolType", g("SchoolType", "schoolType"));

		// Save edits through the existing generic EditLeadDetails endpoint.
		const editLead = () =>
		{
			if (isSubmitting) return;

			let nameOfOrganization = document.getElementById("etNameOfOrganization").value.trim();
			let contactPersonName = document.getElementById("etContactPersonName").value.trim();
			let phone = document.getElementById("etPhone").value.trim();
			let email = document.getElementById("etContactPersonEmail").value.trim();

			if (!nameOfOrganization) { setMsg("Please enter organization name", "warning"); return; }
			if (nameOfOrganization.includes("/")) { setMsg("Organization name should not contain /", "warning"); return; }
			if (!isValidPhone(phone)) { setMsg("Please enter valid phone number", "warning"); return; }
			if (email && !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) { setMsg("Please enter valid email", "warning"); return; }

			isSubmitting = true;
			document.getElementById("fabAddLead").disabled = true;

			let feats = [];
			// Only send core fields that have a value, so we never blank out details that weren't loaded.
			let put = (n, v) => { if (v !== undefined && v !== null && String(v).trim() !== "") feats.push({ FeatureName: n, FeatureValue: String(v).trim() }); };
			// Buyers + coach are always sent so they can also be cleared.
			let putAlways = (n, v) => { feats.push({ FeatureName: n, FeatureValue: (v == null ? "" : String(v)) }); };

			put("Lead", nameOfOrganization);
			put("School_Name", nameOfOrganization);
			put("School_Contact_Person", contactPersonName);
			put("Contact_Number", phone);
			put("Email_ID", email);
			put("Designation", document.getElementById("etContactPersonDesignation").value.trim());
			put("School_Type", document.getElementById("spSchoolType").value);
			put("No_Of_Students", selectedUnitType);
			put("Source", document.getElementById("spSource").value);
			put("Source_Details", document.getElementById("etSourceDetails").value.trim());
			put("Remarks", document.getElementById("etNote").value.trim());

			// Financial details
			let costStudentMonth = document.getElementById("etCostStudentMonth").value.trim();
			if (selectedPaymentType === paymentMethods[0]) { put("RsStudentPerMonth", costStudentMonth); }
			else { put("Lumpsum_Amount", costStudentMonth); }
			put("Payment_Terms", document.getElementById("spPaymentMethod").value);
			put("Installation_Charge", document.getElementById("etInstallationCharge").value.trim());
			put("SMS_Charge", document.getElementById("etSMSCharge").value.trim());
			put("SMS_Free", document.getElementById("etFreeSMSCount").value.trim());
			put("Months_Free", document.getElementById("spFreeMonths").value);
			put("Negotiated_Amount", document.getElementById("etNegotiatedAmount").value.trim());
			put("Quotation_Stage", selectedStage);
			put("Quotation_Date", quotationDateForApi);
			put("Conversion_Date", conversionDateForApi);

			if (BUYERS_COACH_ENABLED)
			{
				putAlways("Buyer1_Name", document.getElementById("etBuyer1Name").value.trim());
				putAlways("Buyer1_Contact", document.getElementById("etBuyer1Contact").value.trim());
				putAlways("Buyer2_Name", document.getElementById("etBuyer2Name").value.trim());
				putAlways("Buyer2_Contact", document.getElementById("etBuyer2Contact").value.trim());
				putAlways("Buyer3_Name", document.getElementById("etBuyer3Name").value.trim());
				putAlways("Buyer3_Contact", document.getElementById("etBuyer3Contact").value.trim());
				putAlways("Coach_Name", document.getElementById("etCoachName").value.trim());
				putAlways("Coach_Contact", document.getElementById("etCoachContact").value.trim());
			}

			let params = ["LeadId"];
			let values = [editLeadId];
			for (let i = 0; i < feats.length; i++)
			{
				params.push(`ListofFeatures[${i}].FeatureName`); values.push(feats[i].FeatureName);
				params.push(`ListofFeatures[${i}].FeatureValue`); values.push(feats[i].FeatureValue);
			}

			let url = BASE_URL + ENDPOINTS.editLeadDetails;
			let dataString = createJSON(params, values);
			setMsg("Updating lead...");

			promisingAjaxCall(url, "POST", dataString, "application/x-www-form-urlencoded").then((res) =>
			{
				if (res && (res.isOk === true || res.IsOk === true))
				{
					setMsg("Lead updated successfully", "success");
					setTimeout(() => { window.location.href = leadsListUrl(); }, 1200);
				}
				else
				{
					setMsg((res && (res.message || res.Message)) || "Failed to update lead", "danger");
					document.getElementById("fabAddLead").disabled = false;
					isSubmitting = false;
				}
			})
			.catch((err) =>
			{
				setMsg(`Error: ${err.message}`, "danger");
				document.getElementById("fabAddLead").disabled = false;
				isSubmitting = false;
			});
		};

		init();
	</script>
</body>

</html>
